[build]
  command = "node build.js"
  publish = "dist"
  # Only spend a build when something that changes the site changed (saves build credits shared with ModSheet).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- build.js site.json content assets netlify.toml"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
